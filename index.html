<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Can You Measure That?</title>
<style>
:root{--ink:#20243a;--muted:#60677b;--paper:#f7f7fb;--card:#fff;--accent:#5946a8;--accent2:#e9e4ff;--line:#e1e3ed;--good:#176b48;--bad:#a3313c;--gold:#e6b84b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--accent);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#fff;color:var(--accent);border:1px solid var(--line)}.quiet{background:transparent;color:var(--muted);border:1px solid var(--line)}header{background:#fff;border-bottom:1px solid var(--line);padding:22px 18px}.head{max-width:980px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:1.25rem;font-weight:850;letter-spacing:-.03em}.brand span{color:var(--accent)}.tag{color:var(--muted);font-size:.88rem}main{max-width:980px;margin:26px auto;padding:0 16px 48px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tab{background:transparent;color:var(--muted);border:1px solid var(--line)}.tab.active{background:var(--accent);color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}.stat,.card,.level-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.stat strong{display:block;font-size:1.6rem}.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:.75rem;font-weight:800;color:var(--accent)}h1,h2,h3{line-height:1.2;letter-spacing:-.025em}h1{font-size:clamp(1.7rem,4vw,2.5rem);margin:.4em 0}h2{font-size:1.45rem;margin:.2em 0 .6em}h3{font-size:1.1rem}.level-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.level-card h3{margin-top:0}.level-card p{color:var(--muted);font-size:.95rem}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:var(--accent2);color:var(--accent);font-size:.8rem;font-weight:750}.progress{height:8px;background:#ececf4;border-radius:99px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}.question-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.scenario{background:#f4f1ff;border-left:4px solid var(--accent);padding:16px;border-radius:8px;margin:18px 0}.options{display:grid;gap:10px}.option{width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);padding:14px 16px;display:flex;gap:12px;align-items:flex-start}.option .letter{flex:none;width:28px;height:28px;border-radius:8px;background:#f0eef9;color:var(--accent);display:grid;place-items:center;font-weight:800}.option.selected{border-color:var(--accent);box-shadow:0 0 0 2px #5946a822}.option.correct{border-color:#64ad88;background:#f0fbf5}.option.wrong{border-color:#d9858b;background:#fff4f4}.feedback{padding:15px;border-radius:12px;margin-top:16px}.feedback.good{background:#eaf7ef;color:var(--good)}.feedback.bad{background:#fff0f1;color:var(--bad)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.hide{display:none!important}.field{display:grid;gap:6px;margin:14px 0}.field label{font-weight:750}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd2e0;border-radius:10px;padding:11px;background:white;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.checklist{display:grid;gap:10px}.checklist label{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.notice{font-size:.85rem;color:var(--muted);margin-top:28px;border-top:1px solid var(--line);padding-top:14px}.guide{margin:18px 0}.guide summary{cursor:pointer;font-size:1.05rem}.guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.guide-grid>div{border:1px solid var(--line);border-radius:12px;padding:14px}.guide-grid h3{margin-top:0}.analysis-list{display:grid;gap:12px;margin-top:18px}.analysis-item{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px}.analysis-item p{margin:4px 0 0}.analysis-mark{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900}.analysis-mark.pass{background:#eaf7ef;color:var(--good)}.analysis-mark.review{background:#fff0d5;color:#825500}.feedback ul{margin-bottom:0}.result{white-space:pre-wrap;background:#f5f3ff;border:1px solid var(--line);border-radius:12px;padding:16px;overflow-wrap:anywhere}.tiny{font-size:.86rem}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}@media(max-width:700px){.grid,.level-list,.guide-grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}main{margin-top:18px}.stat{padding:14px}.card{padding:16px}}
</style></head>
<body><header><div class="head"><div><div class="brand">Can You <span>Measure That?</span></div><div class="tag">A practical learning-objective design lab</div></div><button class="secondary" id="homeBtn">Dashboard</button></div></header>
<main><div id="status" class="card">Loading the question bank…</div><div id="app" class="hide">
<nav class="tabs"><button class="tab active" data-view="dashboard">Dashboard</button><button class="tab" data-view="practice">Practice Lab</button><button class="tab" data-view="mastery">Mastery Check</button><button class="tab" data-view="builder">Objective Builder</button></nav>
<section id="dashboard"></section><section id="practice" class="hide"></section><section id="mastery" class="hide"></section><section id="builder" class="hide"></section>
<div class="notice">Your progress is saved in this browser on this device. It is not sent to a server. Clearing browser data may erase it. This is a practice tool, not a certification of professional proficiency. <button class="quiet" id="resetBtn">Reset progress</button></div></div></main>
<script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];let data,state,view='dashboard',activeQuestion=null,activeLevel=1,attempt=null,selected=null,answered=false,builderOutput='';
const STORE='cy mt_v1';
function fresh(){return {points:0,completed:{},firstAnswers:{},confidence:{},mastery:{},masterySeen:{},builderDraft:{}}}
function loadState(){try{return {...fresh(),...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{return fresh()}}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function allMastery(level){return [...(data.original_mastery_questions||[]).map(q=>({...q,_format:'old'})),...(data.additional_mastery_questions||[]).map(q=>({...q,_format:'new'}))].filter(q=>Number(q.level??({'spot_it':1,'fix_it':2,'prove_it':3}[q.level_id]))===Number(level))}
function go(v){view=v;$$('section[id]').forEach(s=>s.classList.toggle('hide',s.id!==v));$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='dashboard')renderDashboard();if(v==='practice')renderPracticeIntro();if(v==='mastery')renderMasteryIntro();if(v==='builder')renderBuilder();window.scrollTo({top:0,behavior:'smooth'})}
$$('.tab').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));$('#homeBtn').onclick=()=>go('dashboard');
function renderDashboard(){let completed=Object.keys(state.completed).length,acc=Object.keys(state.firstAnswers).length?Math.round(Object.values(state.firstAnswers).filter(Boolean).length/Object.keys(state.firstAnswers).length*100):0;$('#dashboard').innerHTML=`<div class="eyebrow">Your workspace</div><h1>Build objectives that measure real performance.</h1><p class="muted">Use any feature in any order. You do not need to finish the Practice Lab or Mastery Check before using the Objective Builder.</p><details class="card guide"><summary><strong>How to use this tool</strong></summary><div class="guide-grid"><div><h3>1. Practice Lab</h3><p>Work through short challenges. Get feedback and practise writing and assessing measurable objectives.</p><button class="secondary" onclick="go('practice')">Open Practice Lab</button></div><div><h3>2. Mastery Check</h3><p>Answer two questions from a level. Both must be correct to record practice mastery. This is optional.</p><button class="secondary" onclick="go('mastery')">Open Mastery Check</button></div><div><h3>3. Objective Builder</h3><p>Enter your objective and workplace context. Get a criteria-based review, improve the draft, and export your brief if useful.</p><button class="secondary" onclick="go('builder')">Open Objective Builder</button></div></div><p class="tiny muted"><strong>Progress and privacy:</strong> your practice progress is stored in this browser on this device. It is not sent to a server.</p></details><div class="grid"><div class="stat"><span class="muted">Practice points</span><strong>${state.points}</strong><span class="tiny">of ${data.settings.practice_max_score||150}</span></div><div class="stat"><span class="muted">Challenges completed</span><strong>${completed}/15</strong></div><div class="stat"><span class="muted">First-attempt accuracy</span><strong>${acc}%</strong></div></div><h2>Choose a level</h2><div class="level-list">${data.levels.map((l,i)=>{let n=i+1,count=Object.keys(state.completed).filter(id=>data.practice_questions.find(q=>q.id===id)?.level===n).length,unlocked=n===1||Object.keys(state.completed).filter(id=>data.practice_questions.find(q=>q.id===id)?.level===n-1).length===5;return `<div class="level-card"><span class="pill">Level ${n}</span><h3>${esc(l.name)}</h3><p>${esc(l.purpose)}</p><div class="progress"><span style="width:${count/5*100}%"></span></div><p>${count}/5 challenges completed</p><button ${unlocked?'':'disabled'} onclick="startLevel(${n})">${unlocked?'Start / continue':'Complete previous level first'}</button><div style="margin-top:10px"><button class="secondary" onclick="go('mastery');startMastery(${n})">Mastery check</button></div><p class="tiny">${state.mastery[n]?'Practice mastery achieved':'Optional · 2 questions, both correct required'}</p></div>`}).join('')}</div><div class="card" style="margin-top:16px"><h2>Objective Builder</h2><p>Draft a measurable objective, choose an assessment, set success criteria, and check alignment with workplace performance.</p><button onclick="go('builder')">Open Objective Builder</button></div>`}
function startLevel(n){activeLevel=n;go('practice')}
function renderPracticeIntro(){let qs=data.practice_questions.filter(q=>q.level===activeLevel),done=qs.filter(q=>state.completed[q.id]).length;$('#practice').innerHTML=`<div class="eyebrow">Practice Lab · Level ${activeLevel}</div><h1>${esc(data.levels[activeLevel-1].name)}</h1><p class="muted">${esc(data.levels[activeLevel-1].purpose)}</p><div class="card"><div class="row"><div><h2>${done===5?'Level complete':'Your next challenge'}</h2><p>${done}/5 completed. Correct first attempts earn ${data.settings.practice_points_per_first_attempt_correct} points. Retries help you learn but don't add points.</p></div><span class="pill">${done}/5</span></div><div class="progress"><span style="width:${done/5*100}%"></span></div><div class="level-list">${qs.map((q,i)=>`<div class="level-card"><span class="pill">Challenge ${i+1}</span><h3>${esc(q.title)}</h3><p>${state.completed[q.id]?'Completed':esc(q.context||'Practice challenge')}</p><button class="${state.completed[q.id]?'secondary':''}" onclick="playQuestion('${q.id}')">${state.completed[q.id]?'Replay':'Start challenge'}</button></div>`).join('')}</div><div class="actions"><button class="secondary" onclick="go('dashboard')">Back to dashboard</button>${activeLevel<3&&done===5?`<button onclick="startLevel(${activeLevel+1})">Unlock next level</button>`:''}</div></div>`}
function playQuestion(id){activeQuestion=data.practice_questions.find(q=>q.id===id);selected=null;answered=false;renderQuestion()}
function renderQuestion(){let q=activeQuestion;$('#practice').innerHTML=`<div class="question-meta"><span class="pill">Level ${q.level} · ${esc(q.level_name)}</span><span class="muted tiny">${esc(q.context||'Practice')}</span></div><h1>${esc(q.title)}</h1><div class="scenario">${esc(q.scenario)}</div><div class="options">${Object.entries(q.options).map(([k,v])=>`<button class="option ${selected===k?'selected':''} ${answered&&k===q.correct_answer?'correct':''} ${answered&&selected===k&&k!==q.correct_answer?'wrong':''}" ${answered?'disabled':''} onclick="choose('${k}')"><span class="letter">${k}</span><span>${esc(v)}</span></button>`).join('')}</div><div id="answerFeedback">${answered?feedbackHtml(q,selected):''}</div><div class="actions">${!answered?`<button onclick="submitAnswer()" ${selected?'':'disabled'}>Check answer</button>`:`<button onclick="nextPractice()">Back to challenges</button><button class="secondary" onclick="go('dashboard')">Dashboard</button>`}</div>`}
function choose(k){if(answered)return;selected=k;renderQuestion()}
function feedbackHtml(q,k){let ok=k===q.correct_answer,txt=typeof q.feedback==='object'?q.feedback[k]:(q.rationale||'Review the explanation and try to apply the principle to a workplace task.');return `<div class="feedback ${ok?'good':'bad'}"><strong>${ok?'Correct.':'Not quite.'}</strong> ${esc(txt||q.rationale||'Review the explanation.')}${q.takeaway?`<p><strong>Takeaway:</strong> ${esc(q.takeaway)}</p>`:''}</div>`}
function submitAnswer(){if(!selected||answered)return;answered=true;let q=activeQuestion,ok=selected===q.correct_answer;if(!state.firstAnswers.hasOwnProperty(q.id)){state.firstAnswers[q.id]=ok;if(ok)state.points+=Number(data.settings.practice_points_per_first_attempt_correct||10)}state.completed[q.id]=true;save();renderQuestion()}
function nextPractice(){renderPracticeIntro();renderDashboard()}
function renderMasteryIntro(){let levels=data.levels;$('#mastery').innerHTML=`<div class="eyebrow">Optional assessment</div><h1>Practice mastery checks</h1><p class="muted">Each attempt presents two questions from the selected level. You need both correct to achieve practice mastery. These checks are for reflection and practice, not a certification of professional proficiency.</p><div class="level-list">${levels.map((l,i)=>`<div class="level-card"><span class="pill">Level ${i+1}</span><h3>${esc(l.name)}</h3><p>${state.mastery[i+1]?'Practice mastery achieved':'Not yet achieved'}</p><button onclick="startMastery(${i+1})">${state.mastery[i+1]?'Try again':'Start check'}</button></div>`).join('')}</div>`}
function startMastery(n){activeLevel=n;let bank=allMastery(n);let seen=state.masterySeen[n]||[];let unseen=bank.filter(q=>!seen.includes(q.id));if(unseen.length<2){seen=[];unseen=bank}let picked=shuffle(unseen).slice(0,2);attempt={questions:picked,index:0,correct:0,answers:[]};selected=null;answered=false;state.masterySeen[n]=[...seen,...picked.map(q=>q.id)];save();renderMasteryQuestion()}
function normalizedMastery(q){if(q._format==='new'){return {id:q.id,title:q.title,scenario:(q.scenario? q.scenario+' ':'')+q.prompt,options:Object.fromEntries(q.options.map((o,i)=>[String.fromCharCode(65+i),o.text])),correct_answer:String.fromCharCode(65+q.options.findIndex(o=>o.id===q.correct_answer_id)),feedback:Object.fromEntries(q.options.map((o,i)=>[String.fromCharCode(65+i),o.feedback||q.rationale])),takeaway:q.takeaway||q.rationale}}return q}
function renderMasteryQuestion(){let q=normalizedMastery(attempt.questions[attempt.index]);activeQuestion=q;$('#mastery').innerHTML=`<div class="eyebrow">Level ${activeLevel} mastery check</div><div class="question-meta"><span class="pill">Question ${attempt.index+1} of 2</span><span class="muted tiny">${esc(q.title||'Mastery question')}</span></div><h1>${esc(q.title||'Mastery question')}</h1><div class="scenario">${esc(q.scenario)}</div><div class="options">${Object.entries(q.options).map(([k,v])=>`<button class="option ${selected===k?'selected':''} ${answered&&k===q.correct_answer?'correct':''} ${answered&&selected===k&&k!==q.correct_answer?'wrong':''}" ${answered?'disabled':''} onclick="chooseMastery('${k}')"><span class="letter">${k}</span><span>${esc(v)}</span></button>`).join('')}</div><div id="masteryFeedback">${answered?feedbackHtml(q,selected):''}</div><div class="actions">${!answered?`<button onclick="submitMasteryAnswer()" ${selected?'':'disabled'}>Check answer</button>`:`<button onclick="advanceMastery()">${attempt.index===1?'See result':'Next question'}</button>`}</div>`}
function chooseMastery(k){if(answered)return;selected=k;renderMasteryQuestion()}
function submitMasteryAnswer(){if(!selected||answered)return;answered=true;let q=activeQuestion,ok=selected===q.correct_answer;if(ok)attempt.correct++;attempt.answers.push(ok);renderMasteryQuestion()}
function advanceMastery(){if(attempt.index===0){attempt.index=1;selected=null;answered=false;renderMasteryQuestion();return}let pass=attempt.correct===2;if(pass)state.mastery[activeLevel]=true;save();$('#mastery').innerHTML=`<div class="card"><div class="eyebrow">Results</div><h1>${pass?'Practice mastery achieved':'Not quite yet'}</h1><p>You answered ${attempt.correct}/2 correctly. ${pass?'You got both questions right.':'Both answers must be correct to achieve practice mastery. Review the feedback and try another attempt.'}</p><div class="actions"><button onclick="startMastery(${activeLevel})">Try another attempt</button><button class="secondary" onclick="renderMasteryIntro()">Choose a level</button><button class="secondary" onclick="go('dashboard')">Dashboard</button></div></div>`}
function renderBuilder(){let d=state.builderDraft||{};let fields=[['workplace_need','Workplace task / performance need','Describe what employees need to do on the job.'],['objective','Learning objective','Start with an observable action.'],['blooms_level','Bloom’s Taxonomy level',''],['blooms_level_rationale','Why this Bloom’s level?','Explain the cognitive demand, not just the verb.'],['assessment_method','Assessment method','What will the learner do to demonstrate the objective?'],['success_criteria','Success criteria','What would acceptable performance look like?'],['alignment_explanation','How does the assessment align?','Explain how the assessment provides evidence of the objective.'],['review_note','Review note','Anything to validate or improve before use.']];$('#builder').innerHTML=`<div class="eyebrow">Design workspace</div><h1>Objective Builder</h1><p class="muted">Build a mini instructional design brief. Your draft saves in this browser as you work.</p><div class="card"><div class="field"><label for="workplace_need">${fields[0][1]}</label><textarea id="workplace_need" placeholder="e.g. Agents must correctly de-escalate an angry customer in live chat.">${esc(d.workplace_need||'')}</textarea></div>${fields.slice(1,4).map(f=>f[0]==='blooms_level'?`<div class="field"><label for="${f[0]}">${f[1]}</label><select id="${f[0]}"><option value="">Choose a level</option>${['Remember','Understand','Apply','Analyse','Evaluate','Create'].map(x=>`<option ${d.blooms_level===x?'selected':''}>${x}</option>`).join('')}</select></div>`:`<div class="field"><label for="${f[0]}">${f[1]}</label><textarea id="${f[0]}" placeholder="${f[2]}">${esc(d[f[0]]||'')}</textarea></div>`).join('')}${fields.slice(4).map(f=>`<div class="field"><label for="${f[0]}">${f[1]}</label><textarea id="${f[0]}" placeholder="${f[2]}">${esc(d[f[0]]||'')}</textarea></div>`).join('')}<div class="scenario"><strong>Workplace Reality Check</strong><br>Ask whether it measures the thing the employee actually needs to do on the job.<br><span class="tiny">Example: identifying a fraudulent transaction is different from correctly blocking it. If the job requires stopping it, the assessment should let the learner demonstrate the procedure in a realistic simulation.</span></div><h2>Quality checklist</h2><div class="checklist">${data.quality_checklist.map((x,i)=>`<label><input type="checkbox" id="qc${i}" ${d.checks?.includes(i)?'checked':''}> <span>${esc(typeof x==='string'?x:x.text||x.label||JSON.stringify(x))}</span></label>`).join('')}</div><div class="actions"><button onclick="analyzeObjective()">Analyze my objective</button><button class="secondary" onclick="generateBrief()">Create brief</button><button class="secondary" onclick="clearBuilder()">Clear draft</button></div><p class="tiny muted">The review is a transparent, rule-based check of the text you enter. It is not an AI model or a substitute for review by a learning designer or subject-matter expert.</p><div id="analysisResult" style="margin-top:18px"></div><div id="builderResult" style="margin-top:18px">${builderOutput?`<h2>Your brief</h2><div class="result">${esc(builderOutput)}</div><button class="secondary" onclick="copyBrief()">Copy brief</button>`:''}</div></div>`;fields.forEach(f=>{let el=$('#'+f[0]);el.addEventListener('input',saveBuilder)});$$('[id^="qc"]').forEach(el=>el.addEventListener('change',saveBuilder))}
function saveBuilder(){let d={};['workplace_need','objective','blooms_level','blooms_level_rationale','assessment_method','success_criteria','alignment_explanation','review_note'].forEach(k=>{let el=$('#'+k);if(el)d[k]=el.value});d.checks=$$('[id^="qc"]').filter(x=>x.checked).map(x=>Number(x.id.slice(2)));state.builderDraft=d;save()}
function analyzeObjective(){
 saveBuilder();
 const d=state.builderDraft||{};
 const objective=(d.objective||'').trim();
 const workplace=(d.workplace_need||'').trim();
 const assessment=(d.assessment_method||'').trim();
 const criteria=(d.success_criteria||'').trim();
 const rationale=(d.blooms_level_rationale||'').trim();
 const chosen=(d.blooms_level||'').trim();
 const findings=[];
 if(!objective){$('#analysisResult').innerHTML='<div class="feedback bad"><strong>Add a learning objective first.</strong><p>Enter the objective in the field above, then select Analyze my objective.</p></div>';return}
 const lower=objective.toLowerCase();
 const vague=/\b(understand|know|learn|appreciate|be aware of|be familiar with|become familiar with|gain knowledge of)\b/i.test(objective);
 const observable=/\b(identify|list|name|describe|explain|summarize|compare|classify|demonstrate|apply|use|calculate|complete|perform|resolve|select|analyse|analyze|differentiate|evaluate|assess|justify|design|create|develop|construct|recommend|prioritise|prioritize|diagnose|interpret|draft|write|deliver|record|escalate|configure|assign|revoke|block|investigate|verify|inspect|produce|present|choose|outline|execute|follow|respond|classify)\b/i.test(objective);
 const condition=/\b(given|when|using|with|without|from|in a|in an|during|after|within|based on|according to|following|under)\b/i.test(objective);
 const criterion=/\b(at least|at most|\d+|within \w+|no more than|without errors|with \w+%|to the required|against (?:the )?(?:criteria|standard|checklist)|all required|correctly|accurately|within the|by the end)\b/i.test(objective);
 const genericLength=objective.split(/\s+/).length;
 if(vague)findings.push({ok:false,title:'Vague outcome language found',text:'The objective uses wording such as “understand”, “know” or “learn”. Replace it with something observable that a learner can demonstrate.'});
 else findings.push({ok:observable,title:observable?'Observable action found':'Action needs review',text:observable?'The objective includes an action that can usually be observed. Check that the action reflects the actual job task.':'No clear observable action was detected by this checklist. Consider a verb such as identify, explain, demonstrate, resolve, evaluate or create—whichever matches the job.'});
 if(condition)findings.push({ok:true,title:'Context or condition detected',text:'The objective appears to specify a condition or context. Confirm it reflects the situation employees face at work.'});
 else findings.push({ok:false,title:'Condition or context may be missing',text:'Consider stating what the employee will be given, where the task happens, or what procedure, system or reference they may use—if that context is needed to assess performance.'});
 if(criterion)findings.push({ok:true,title:'A success indicator may be present',text:'The wording appears to include a criterion or standard. Make sure it reflects a meaningful performance requirement, not an arbitrary number.'});
 else findings.push({ok:false,title:'Success criteria may be missing',text:'State what acceptable performance looks like when the task needs a standard—for example, meeting required steps, using defined criteria, or completing the task within an agreed service target.'});
 if(genericLength<6)findings.push({ok:false,title:'Objective may be too brief',text:'Add enough context to make the expected performance clear. Short is fine; ambiguous is not.'});
 if(workplace){const terms=workplace.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>4);const overlaps=terms.filter(w=>lower.includes(w));findings.push({ok:overlaps.length>0,title:overlaps.length>0?'Possible link to the workplace need':'Workplace alignment needs a human check',text:overlaps.length>0?'Some wording overlaps with the stated workplace need. Confirm the objective targets the performance gap, not merely the topic.':'The objective does not obviously reuse key terms from the workplace need. That is not automatically a problem; check whether it addresses the task employees actually need to perform.'})}
 else findings.push({ok:false,title:'Workplace need not supplied',text:'Add the job task or performance gap so you can judge whether the objective and assessment are relevant to real work.'});
 if(chosen){const maps={Remember:/\b(recall|recognise|recognize|name|list|identify|define|retrieve|select)\b/i,Understand:/\b(explain|describe|summarize|summarise|classify|interpret|illustrate|paraphrase)\b/i,Apply:/\b(apply|use|demonstrate|perform|execute|complete|calculate|implement|configure|resolve|follow)\b/i,Analyse:/\b(analyse|analyze|differentiate|compare|contrast|investigate|diagnose|examine|organise|organize)\b/i,Evaluate:/\b(evaluate|assess|justify|recommend|critique|defend|prioritise|prioritize|judge)\b/i,Create:/\b(create|design|develop|construct|formulate|produce|draft|build|devise)\b/i};const matched=maps[chosen]?.test(objective);findings.push({ok:!!matched,title:matched?'Possible Bloom’s alignment':'Review the Bloom’s level',text:matched?'The objective contains an action often associated with '+chosen+'. Verbs alone do not determine Bloom’s level; consider the thinking the task actually requires.':'The action wording does not clearly signal '+chosen+' in this simple check. Bloom’s level depends on the cognitive demand and task, not the verb alone.'})}
 else findings.push({ok:false,title:'Bloom’s level not selected',text:'Choose a level if useful, then explain the thinking the learner must do. Do not select a level based on the verb alone.'});
 if(assessment){const assessLow=assessment.toLowerCase();let note='Check whether the assessment asks the learner to produce the same kind of evidence named in the objective.';if(/quiz|multiple.choice|mcq|select the correct/i.test(assessLow)&&/\b(demonstrate|perform|execute|resolve|complete|configure|block|deliver|respond|create|design)\b/i.test(objective))note='Potential mismatch: the objective appears to require practical performance, but the assessment wording suggests a quiz. Consider a simulation, work sample, role-play or observed task.';findings.push({ok:!note.startsWith('Potential mismatch'),title:note.startsWith('Potential mismatch')?'Possible assessment mismatch':'Assessment entered',text:note})}
 else findings.push({ok:false,title:'Assessment method not supplied',text:'Describe what the learner will actually do to demonstrate the objective. Choose a method that produces the evidence the job requires.'});
 if(criteria)findings.push({ok:true,title:'Success criteria entered',text:'Review whether the criteria are observable, specific enough to judge performance, and appropriate to the risk and complexity of the task.'});
 else findings.push({ok:false,title:'Success criteria not entered',text:'Add the standard you will use to judge the learner’s performance. Avoid inventing a percentage if the task calls for a different kind of standard.'});
 if(rationale)findings.push({ok:true,title:'Bloom’s rationale entered',text:'Check that the rationale describes the thinking required by the task, rather than repeating the chosen level or verb.'});
 const good=findings.filter(f=>f.ok).length, total=findings.length;
 const label=good>=total-1?'Mostly aligned — review the notes':good>=Math.ceil(total*.55)?'Partly aligned — revisions recommended':'Needs work before use';
 const suggested=objective.replace(/\b(understand|know|learn|appreciate|be aware of|be familiar with)\b/ig,'demonstrate');
 $('#analysisResult').innerHTML=`<div class="card"><div class="eyebrow">Objective review</div><h2>${label}</h2><p><strong>${good} of ${total}</strong> checks passed or have information to review. This is a checklist-based signal, not a validated score or an automatic approval.</p><div class="analysis-list">${findings.map(f=>`<div class="analysis-item"><span class="analysis-mark ${f.ok?'pass':'review'}">${f.ok?'✓':'!'}</span><div><strong>${esc(f.title)}</strong><p>${esc(f.text)}</p></div></div>`).join('')}</div><div class="scenario"><strong>Workplace Reality Check</strong><br>Ask whether the assessment measures the thing the employee actually needs to do on the job. A close match in wording is not proof of job relevance.</div></div>`;
}
function generateBrief(){saveBuilder();let d=state.builderDraft;let labels={workplace_need:'Workplace task / performance need',objective:'Learning objective',blooms_level:'Bloom’s Taxonomy level',blooms_level_rationale:'Rationale',assessment_method:'Assessment method',success_criteria:'Success criteria',alignment_explanation:'Alignment explanation',review_note:'Review note'};builderOutput=Object.entries(labels).map(([k,v])=>`${v}\n${d[k]||'—'}`).join('\n\n')+'\n\nQuality checklist\n'+data.quality_checklist.map((x,i)=>`${d.checks?.includes(i)?'[x]':'[ ]'} ${typeof x==='string'?x:x.text||x.label||JSON.stringify(x)}`).join('\n');$('#builderResult').innerHTML=`<h2>Your brief</h2><div class="result" id="briefText">${esc(builderOutput)}</div><div class="actions"><button class="secondary" onclick="copyBrief()">Copy brief</button><button class="secondary" onclick="downloadBrief()">Download .txt</button></div>`}
function copyBrief(){navigator.clipboard?.writeText(builderOutput).then(()=>alert('Brief copied.')).catch(()=>alert('Copy was blocked by your browser. Select the brief text and copy it manually.'))}
function downloadBrief(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([builderOutput],{type:'text/plain;charset=utf-8'}));a.download='objective-builder-brief.txt';a.click();URL.revokeObjectURL(a.href)}
function clearBuilder(){if(!confirm('Clear the Objective Builder draft?'))return;state.builderDraft={};builderOutput='';save();renderBuilder()}
$('#resetBtn').onclick=()=>{if(confirm('Reset all points, challenge history, confidence and mastery progress on this browser? This cannot be undone.')){state=fresh();save();go('dashboard')}};
async function init(){try{let res=await fetch('./can_you_measure_that_consolidated_master.json');if(!res.ok)throw Error('Could not load the question bank file.');data=await res.json();state=loadState();$('#status').classList.add('hide');$('#app').classList.remove('hide');renderDashboard()}catch(e){$('#status').innerHTML=`<h2>Question bank not loaded</h2><p>The app could not load <code>can_you_measure_that_consolidated_master.json</code>.</p><p>Make sure the HTML file and JSON file are in the same GitHub Pages folder and that the JSON filename matches exactly.</p><p class="tiny">Technical detail: ${esc(e.message)}</p>`}}
init();
</script></body></html>
